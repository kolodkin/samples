[project]
name = "github-exposure-scanner"
version = "0.1.0"
description = "Scan a company's public GitHub repos for leaked secrets and profile its exposure"
requires-python = ">=3.10"

dependencies = [
    "aaiclick[distributed]>=0.0.24",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
