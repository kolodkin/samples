# One service per framework. Sidecar engines (clickhouse, postgres) are
# long-lived and shared with their framework runner via depends_on +
# healthcheck. The runner inside each framework container loops through all
# 11 ops; per-op wall-clock, peak memory (cgroup memory.peak delta), and
# CPU (cgroup cpu.stat delta) are written to /data/results-<framework>.json.

services:
  orchestrator:
    build: { context: ., dockerfile: Dockerfile.orchestrator }
    volumes: [ "./data:/data" ]
    profiles: [ "tools" ]

  # --- engines ---

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    # /data is mounted twice so both file:///data/... and CH's default
    # user_files path resolve to the same shared parquet file. aaiclick may
    # use either depending on which CH table function it picks under the hood.
    volumes:
      - "./data:/data"
      - "./data:/var/lib/clickhouse/user_files"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: [ "bench" ]

  postgres:
    image: postgres:16
    volumes: [ "./data:/data" ]
    environment:
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: bench
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: [ "bench" ]

  # --- framework runners ---

  aaiclick:
    build: { context: ., dockerfile: Dockerfile.aaiclick }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    profiles: [ "bench" ]

  spark:
    build: { context: ., dockerfile: Dockerfile.spark }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    mem_limit: 6g
    profiles: [ "bench" ]

  dask:
    build: { context: ., dockerfile: Dockerfile.dask }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    mem_limit: 6g
    profiles: [ "bench" ]

  ray:
    build: { context: ., dockerfile: Dockerfile.ray }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    mem_limit: 6g
    shm_size: 1g
    profiles: [ "bench" ]

  postgres-runner:
    build: { context: ., dockerfile: Dockerfile.postgres }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: benchmark
      PGDATABASE: bench
      FRAMEWORK: postgres
    profiles: [ "bench" ]
