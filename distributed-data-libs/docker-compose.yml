# One service per framework. aaiclick depends on two sidecars: a ClickHouse
# server (the data engine) and a Postgres server (the metadata catalog).
# Spark/Dask/Ray run in-process and need no sidecars. The runner inside each
# framework container loops through all 11 ops; per-op wall-clock, peak
# memory (cgroup memory.peak delta), and CPU (cgroup cpu.stat delta) are
# written to /data/results-<framework>.json.

services:
  orchestrator:
    build: { context: ., dockerfile: Dockerfile.orchestrator }
    volumes: [ "./data:/data" ]
    profiles: [ "tools" ]

  # --- engine sidecars for aaiclick's distributed mode ---

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    # /data mounted twice so both file:///data/... and CH's default
    # user_files path resolve to the same parquet file. aaiclick may use
    # either depending on which CH table function it picks under the hood.
    volumes:
      - "./data:/data"
      - "./data:/var/lib/clickhouse/user_files"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: [ "bench" ]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: aaiclick
      POSTGRES_USER: aaiclick
      POSTGRES_DB: aaiclick
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "aaiclick" ]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: [ "bench" ]

  # aaiclick's create_object_from_url uses ClickHouse's url() table
  # function, which requires HTTP. nginx serves /data/ so CH can pull
  # raw.parquet directly (no Python dict round-trip). No healthcheck:
  # nginx:alpine has no curl/wget that accepts --spider, and nginx is
  # ready the instant it binds port 80 — depends_on: service_started
  # is sufficient.
  fileserver:
    image: nginx:alpine
    volumes:
      - "./data:/usr/share/nginx/html:ro"
    profiles: [ "bench" ]

  # --- framework runners ---

  aaiclick:
    build: { context: ., dockerfile: Dockerfile.aaiclick }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres:   { condition: service_healthy }
      fileserver: { condition: service_started }
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: aaiclick
      PGPASSWORD: aaiclick
      PGDATABASE: aaiclick
      FILESERVER_URL: http://fileserver
    profiles: [ "bench" ]

  spark:
    build: { context: ., dockerfile: Dockerfile.spark }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    mem_limit: 6g
    profiles: [ "bench" ]

  dask:
    build: { context: ., dockerfile: Dockerfile.dask }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    mem_limit: 6g
    profiles: [ "bench" ]

  ray:
    build: { context: ., dockerfile: Dockerfile.ray }
    volumes: [ "./data:/data" ]
    command: [ "python", "-m", "distributed_data_libs.runner" ]
    mem_limit: 6g
    shm_size: 1g
    profiles: [ "bench" ]
