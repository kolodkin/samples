name: distributed-data-libs

on:
  workflow_dispatch:
  push:
    paths:
      - 'distributed-data-libs/**'
      - '.github/workflows/distributed-data-libs.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-data-libs
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: dcdl-buildx-${{ hashFiles('distributed-data-libs/Dockerfile.*', 'distributed-data-libs/docker-compose.yml') }}
          restore-keys: |
            dcdl-buildx-

      - name: Build images
        run: docker compose --profile tools --profile bench build

      - name: Run benchmark
        # shell: bash enables pipefail so a failing benchmark script propagates
        # through the tee pipe (default GH Actions bash runs without pipefail).
        shell: bash
        run: ./distributed-data-libs.sh | tee /tmp/bench.txt

      - name: Publish summary
        if: always()
        run: |
          echo '## Distributed Data Libs Benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bench.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
