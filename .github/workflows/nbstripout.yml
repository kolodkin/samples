name: nbstripout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.ipynb'
      - '.pre-commit-config.yaml'
  push:
    paths:
      - '**/*.ipynb'
      - '.pre-commit-config.yaml'

jobs:
  nbstripout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Verify notebooks are stripped of outputs
        run: uvx pre-commit run nbstripout --all-files --show-diff-on-failure
