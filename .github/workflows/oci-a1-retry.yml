# Periodically tries to create the Always Free A1 instance until OCI has
# capacity. Each run makes up to 8 attempts (one per minute), then yields to
# the next scheduled run. Once the instance exists, runs become instant no-ops
# — disable the workflow at that point.
#
# Only two repository secrets are needed
# (Settings > Secrets and variables > Actions > Secrets):
#   OCI_PRIVATE_KEY   full PEM content of the API signing key
#   OCI_USER_OCID     your user OCID (My profile) — an identifier, but this
#                     repo is public, so keep it out of the source
#   OCI_TENANCY_OCID  your tenancy OCID (profile menu > Tenancy)
#
# The key fingerprint is derived from the private key, the region is set below,
# and compartment / availability domains / subnet / image are discovered from
# the tenancy at run time. Optional repository *variables* override defaults:
# OCI_REGION, OCI_SSH_PUBLIC_KEY, OCPUS, MEMORY_GB, DISPLAY_NAME.
name: OCI A1 instance retry

on:
  schedule:
    - cron: '*/15 * * * *'   # best-effort; GitHub may delay or skip firings
  workflow_dispatch:

concurrency:
  group: oci-a1-retry
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Configure OCI auth
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION || 'il-jerusalem-1' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
          # The console shows this fingerprint, but it is just an MD5 of the
          # public half — deriving it keeps one more value out of the secrets.
          fingerprint=$(openssl rsa -in ~/.oci/key.pem -pubout -outform DER 2>/dev/null \
            | openssl dgst -md5 -c | sed 's/.*= //')
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          fingerprint=$fingerprint
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config ~/.oci/key.pem
          oci iam region list > /dev/null   # fails loudly on bad credentials

      - name: Attempt instance launch
        env:
          OCI_SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
          OCPUS: ${{ vars.OCPUS || 2 }}
          MEMORY_GB: ${{ vars.MEMORY_GB || 12 }}
          DISPLAY_NAME: ${{ vars.DISPLAY_NAME || 'a1-free' }}
          MAX_ATTEMPTS: 8
          RETRY_SECONDS: 60
        run: |
          # Falls back to oci-a1-retry/authorized_key.pub when the variable is unset.
          if [ -n "$OCI_SSH_PUBLIC_KEY" ]; then
            printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > /tmp/ssh_key.pub
            export SSH_PUB_KEY_FILE=/tmp/ssh_key.pub
          fi
          rc=0
          ./oci-a1-retry/create-instance.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::Still out of capacity — next scheduled run will retry."
            exit 0
          fi
          exit "$rc"
