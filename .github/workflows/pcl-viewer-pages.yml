name: pcl-viewer-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pcl-viewer/web/**'
      - 'pcl-viewer/vendor.sh'
      - '.github/workflows/pcl-viewer-pages.yml'

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcl-viewer
    steps:
      - uses: actions/checkout@v4

      - name: Vendor frontend ES modules
        run: ./vendor.sh

      - name: Stage site under /pcl-viewer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/pcl-viewer"
          cp -r web/. "$GITHUB_WORKSPACE/_site/pcl-viewer/"
          # Redirect the Pages root to the viewer for convenience.
          cat > "$GITHUB_WORKSPACE/_site/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>PCL Viewer</title>
          <meta http-equiv="refresh" content="0; url=./pcl-viewer/" />
          <a href="./pcl-viewer/">PCL Viewer</a>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
